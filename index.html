<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>校跑跑 · 校园跑腿互助平台</title>
<style>
  :root{
    --primary:#FF6A2B; --primary-soft:#FFF1EA;
    --trust:#12B76A;   --trust-soft:#EAF9F1;
    --amber:#F79009;   --amber-soft:#FFF7E6;
    --red:#F04438;     --red-soft:#FEECEB;
    --blue:#2E90FA;    --violet:#7A5AF8;
    --bg:#F6F7F9; --card:#FFFFFF; --ink:#17181C; --sub:#7A7F87; --line:#ECEEF1;
    --radius:16px;
    --shadow:0 1px 2px rgba(23,24,28,.04),0 4px 16px rgba(23,24,28,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  }
  #app{max-width:520px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:78px}

  /* ===== 顶栏 ===== */
  .topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .topbar-in{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.5px}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#FF8A4C,#FF5A1F);display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 4px 10px rgba(255,106,43,.35)}
  .logo b{color:var(--primary)}
  .credit-chip{display:flex;align-items:center;gap:6px;background:var(--trust-soft);color:var(--trust);font-weight:700;font-size:13px;padding:6px 11px;border-radius:20px}
  .credit-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--trust)}

  /* ===== 首页 ===== */
  .view{display:none;padding:16px 18px 24px}
  .view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .hero{background:linear-gradient(135deg,#FF7A3D,#FF4D2E);border-radius:18px;padding:20px 18px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero h1{font-size:20px;font-weight:800;margin-bottom:6px}
  .hero p{font-size:13px;opacity:.92}
  .hero .trust-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .hero .trust-row span{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}

  .sec-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .sec-title h2{font-size:16px;font-weight:800}
  .sec-title .count{font-size:12px;color:var(--sub)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:8px 14px;border-radius:22px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;transition:.18s;white-space:nowrap}
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* 任务卡片 */
  .task-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s}
  .task-card:active{transform:scale(.985)}
  .task-head{display:flex;align-items:flex-start;gap:10px}
  .cat-ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:0 0 auto}
  .task-meta{flex:1;min-width:0}
  .task-title{font-weight:700;font-size:15px;margin-bottom:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;flex:0 0 auto}
  .tag.credit-low{background:var(--amber-soft);color:var(--amber)}
  .tag.credit-mid{background:var(--blue-soft,#EBF3FE);color:var(--blue)}
  .task-sub{font-size:12.5px;color:var(--sub);display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
  .task-sub span{display:flex;align-items:center;gap:4px}
  .task-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .publisher{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FFD3B8,#FFB48A);color:#B8430F;display:grid;place-items:center;font-weight:800;font-size:12px;flex:0 0 auto}
  .verified{display:inline-flex;align-items:center;gap:2px;color:var(--trust);font-weight:700;font-size:11px}
  .reward{font-size:18px;font-weight:800;color:var(--primary)}
  .reward small{font-size:11px;font-weight:600}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:none;cursor:pointer;font-weight:700;font-size:13.5px;border-radius:12px;padding:9px 16px;transition:.15s}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(255,106,43,.3)}
  .btn-primary:active{background:#E8551D}
  .btn-ghost{background:var(--primary-soft);color:var(--primary)}
  .btn-trust{background:var(--trust);color:#fff}
  .btn-block{width:100%;padding:13px;font-size:15px}
  .btn:disabled{background:#D8DBDF;color:#fff;box-shadow:none;cursor:not-allowed}

  .status-pill{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px}
  .status-open{background:var(--trust-soft);color:var(--trust)}
  .status-accepted{background:var(--amber-soft);color:var(--amber)}
  .status-done{background:#EEF0F3;color:var(--sub)}

  /* ===== 发布 ===== */
  .form-card{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field label em{color:var(--primary);font-style:normal}
  input[type=text],textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;background:#FAFBFC;outline:none;transition:.15s}
  input:focus,textarea:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px var(--primary-soft)}
  textarea{resize:none;height:88px}
  .cat-pick{display:flex;gap:8px;flex-wrap:wrap}
  .cat-pick .chip{background:#FAFBFC}
  .cat-pick .chip.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
  .reward-input{display:flex;align-items:center;gap:8px}
  .reward-input span{font-size:18px;font-weight:800;color:var(--primary)}
  .tip{background:var(--trust-soft);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--trust);margin-bottom:16px;display:flex;gap:8px;align-items:flex-start}

  /* ===== 我的 ===== */
  .profile{background:linear-gradient(135deg,#FF7A3D,#FF4D2E);border-radius:18px;padding:20px;color:#fff;margin-bottom:16px}
  .profile-top{display:flex;align-items:center;gap:14px}
  .avatar-lg{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:26px;font-weight:800}
  .profile-name{font-size:18px;font-weight:800;display:flex;align-items:center;gap:6px}
  .profile-school{font-size:12.5px;opacity:.9;margin-top:3px}
  .badge-verified{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:2px 8px;border-radius:20px}
  .credit-panel{display:flex;align-items:center;gap:16px;margin-top:18px}
  .ring-wrap{position:relative;width:84px;height:84px;flex:0 0 auto}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
  .ring-center .num{font-size:24px;font-weight:800;line-height:1}
  .ring-center .lbl{font-size:10px;opacity:.85}
  .credit-info{flex:1}
  .credit-info .lv{font-size:15px;font-weight:800;margin-bottom:4px}
  .credit-info p{font-size:12px;opacity:.9;line-height:1.6}

  .tab2{display:flex;background:#fff;border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
  .tab2 button{flex:1;border:none;background:none;padding:9px;font-size:13.5px;font-weight:700;color:var(--sub);border-radius:9px;cursor:pointer}
  .tab2 button.active{background:var(--ink);color:#fff}

  .history-item{background:#fff;border-radius:14px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
  .history-item .h-ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
  .history-item .h-txt{flex:1;min-width:0}
  .history-item .h-txt b{font-size:14px;display:block}
  .history-item .h-txt span{font-size:12px;color:var(--sub)}
  .score-delta{font-weight:800;font-size:15px}
  .score-plus{color:var(--trust)} .score-minus{color:var(--red)}

  .empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:13px}
  .empty .e{font-size:40px;margin-bottom:8px}

  /* ===== 底部导航 ===== */
  .tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .tabbar-in{max-width:520px;margin:0 auto;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--sub);font-weight:600;cursor:pointer;padding:4px 0}
  .tabbar button.active{color:var(--primary)}
  .tabbar .t-ico{font-size:22px;line-height:1}
  .tabbar .fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#FF8A4C,#FF5A1F);color:#fff;display:grid;place-items:center;font-size:26px;margin-top:-22px;box-shadow:0 6px 16px rgba(255,106,43,.4);border:4px solid #fff;flex:0 0 auto}

  /* ===== 详情浮层 ===== */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.25s}
  .mask.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:#fff;border-radius:22px 22px 0 0;max-width:520px;margin:0 auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:.28s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow-y:auto}
  .sheet.show{transform:none}
  .grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
  .sheet .cat-big{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sheet h3{font-size:19px;font-weight:800;margin-bottom:6px}
  .sheet .desc{font-size:14px;color:var(--sub);background:#FAFBFC;border-radius:12px;padding:12px;margin:12px 0}
  .kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .kv b{font-weight:700}
  .kv .v{color:var(--sub);display:flex;align-items:center;gap:5px}
  .sheet .actions{margin-top:18px;display:flex;flex-direction:column;gap:10px}
  .credit-note{background:var(--trust-soft);color:var(--trust);font-size:12.5px;border-radius:12px;padding:10px 13px;display:flex;gap:7px;align-items:flex-start}

  /* ===== toast ===== */
  #toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(23,24,28,.92);color:#fff;padding:11px 20px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-in">
      <div class="logo"><span class="mark">跑</span><span>校<b>跑跑</b></span></div>
      <div class="credit-chip" onclick="go('me')"><span class="dot"></span>信用分 <span id="topCredit">96</span></div>
    </div>
  </header>

  <!-- 首页：任务大厅 -->
  <section class="view active" id="view-home">
    <div class="hero">
      <h1>同学互助，跑腿无忧 🚀</h1>
      <p>实名认证 · 信用分 · 双向评价，让每一次托付都放心</p>
      <div class="trust-row">
        <span>✅ 实名认证</span><span>🛡️ 信用分体系</span><span>🤝 双向评价</span>
      </div>
    </div>

    <div class="sec-title"><h2>任务大厅</h2><span class="count" id="taskCount"></span></div>
    <div class="chips" id="chips"></div>
    <div id="taskList"></div>
  </section>

  <!-- 发布任务 -->
  <section class="view" id="view-publish">
    <div class="sec-title"><h2>发布跑腿任务</h2></div>
    <div class="form-card">
      <div class="tip">💡 发布与接单均需实名认证，跑腿费由平台托管，完成后结算给对方。</div>
      <div class="field">
        <label>任务类型 <em>*</em></label>
        <div class="cat-pick" id="publishCat"></div>
      </div>
      <div class="field">
        <label>任务标题 <em>*</em></label>
        <input type="text" id="pTitle" placeholder="例：菜鸟驿站代取 2 个包裹" maxlength="24">
      </div>
      <div class="field">
        <label>任务描述</label>
        <textarea id="pDesc" placeholder="补充取件码、送达地点、注意事项等"></textarea>
      </div>
      <div class="field">
        <label>跑腿费（元）<em>*</em></label>
        <div class="reward-input"><span>¥</span><input type="text" id="pReward" placeholder="3" maxlength="4"></div>
      </div>
      <div class="field">
        <label>取件/任务地点</label>
        <input type="text" id="pLoc" placeholder="例：雁栖湖校区菜鸟驿站">
      </div>
      <div class="field">
        <label>截止时间</label>
        <input type="text" id="pDeadline" placeholder="例：今天 17:00 前">
      </div>
      <button class="btn btn-primary btn-block" onclick="publish()">发布任务</button>
    </div>
  </section>

  <!-- 我的 -->
  <section class="view" id="view-me">
    <div class="profile">
      <div class="profile-top">
        <div class="avatar-lg">陈</div>
        <div>
          <div class="profile-name">陈珂 <span class="badge-verified">✔ 已实名</span></div>
          <div class="profile-school">中国科学院大学 · 情报学</div>
        </div>
      </div>
      <div class="credit-panel">
        <div class="ring-wrap">
          <svg width="84" height="84">
            <circle cx="42" cy="42" r="36" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="8"/>
            <circle id="ringBar" cx="42" cy="42" r="36" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
          </svg>
          <div class="ring-center"><div class="num" id="myScore">96</div><div class="lbl">信用分</div></div>
        </div>
        <div class="credit-info">
          <div class="lv">🏅 信用等级：极好</div>
          <p>按时完成 12 单 · 好评率 100%<br>信用分越高，接单被选中的概率越大</p>
        </div>
      </div>
    </div>

    <div class="tab2">
      <button class="active" data-tab="published" onclick="switchMyTab('published')">我发布的</button>
      <button data-tab="accepted" onclick="switchMyTab('accepted')">我接的单</button>
      <button data-tab="history" onclick="switchMyTab('history')">信用记录</button>
    </div>
    <div id="myList"></div>
  </section>

  <nav class="tabbar">
    <div class="tabbar-in">
      <button class="active" data-view="home" onclick="go('home')"><span class="t-ico">🏠</span>大厅</button>
      <button data-view="publish" onclick="go('publish')"><span class="t-ico">✍️</span>发布</button>
      <div class="fab" onclick="go('publish')">＋</div>
      <button data-view="me" onclick="go('me')"><span class="t-ico">👤</span>我的</button>
    </div>
  </nav>
</div>

<!-- 任务详情浮层 -->
<div class="mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

<div id="toast"></div>

<script>
/* ============ 数据 ============ */
const CATS = {
  express:{name:'代取快递', icon:'📦', color:'#FFE9DC', ico:'#FF6A2B'},
  buy:{name:'代买物品', icon:'🛒', color:'#E6F0FE', ico:'#2E90FA'},
  seat:{name:'代占座',   icon:'💺', color:'#EFE9FE', ico:'#7A5AF8'},
  print:{name:'代打印',  icon:'🖨️', color:'#E7F8EF', ico:'#12B76A'},
  other:{name:'其他跑腿', icon:'🏃', color:'#EFF1F4', ico:'#667085'},
};
const ME = { name:'陈珂', school:'中国科学院大学', credit:96, verified:true };

let tasks = load('xp_tasks') || seedTasks();
let myTab = 'published';

function seedTasks(){
  return [
    {id:'t1',cat:'express',title:'菜鸟驿站代取 2 个包裹',desc:'两个小包裹，取件码已私发。送到 5 号宿舍楼下即可。',reward:3,loc:'雁栖湖菜鸟驿站',deadline:'今天 17:00 前',status:'open',pub:'李同学',pubCredit:95,pubVerified:true},
    {id:'t2',cat:'buy',title:'三食堂黄焖鸡（不加辣）',desc:'中午帮带一份黄焖鸡米饭，不加辣，送到图书馆门口。',reward:4,loc:'三食堂',deadline:'今天 12:00 前',status:'open',pub:'王同学',pubCredit:88,pubVerified:true},
    {id:'t3',cat:'seat',title:'图书馆四楼靠窗座位',desc:'明早 8 点帮占四楼靠窗安静区座位，共 2 个。',reward:6,loc:'图书馆四楼',deadline:'明天 08:00 前',status:'open',pub:'张同学',pubCredit:92,pubVerified:true},
    {id:'t4',cat:'print',title:'打印 20 页讲义送教二楼',desc:'PDF 已发，双面打印装订，送到教二楼 305。',reward:5,loc:'校园打印店',deadline:'今天 20:00 前',status:'open',pub:'刘同学',pubCredit:76,pubVerified:false},
    {id:'t5',cat:'other',title:'帮搬宿舍行李（2 个箱子）',desc:'周六下午搬家，帮忙从 5 号楼搬到 8 号楼，有电梯。',reward:15,loc:'5 号宿舍楼',deadline:'周六 14:00',status:'open',pub:'赵同学',pubCredit:90,pubVerified:true},
    {id:'t6',cat:'express',title:'南门驿站代取大件快递',desc:'电脑椅，比较大件，需要小推车，送到 6 号楼。',reward:10,loc:'南门驿站',deadline:'今天 22:00 前',status:'accepted',pub:ME.name,pubCredit:ME.credit,pubVerified:true,acc:'周同学',accCredit:89},
    {id:'t7',cat:'buy',title:'帮带一杯珍珠奶茶',desc:'校门口奶茶店，三分糖去冰，送到二食堂门口。',reward:3,loc:'校门口奶茶店',deadline:'昨天 18:00',status:'done',pub:'孙同学',pubCredit:93,pubVerified:true,acc:ME.name,accCredit:ME.credit},
    {id:'t8',cat:'express',title:'顺丰代取文件快递',desc:'很轻的文件，但比较急，取到后送到实验楼 3 楼。',reward:5,loc:'顺丰驿站',deadline:'今天 19:00 前',status:'open',pub:'吴同学',pubCredit:98,pubVerified:true},
  ];
}

/* ============ 存储 ============ */
function load(k){ try{return JSON.parse(localStorage.getItem(k))}catch(e){return null} }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)) }
function persist(){ save('xp_tasks', tasks) }

/* ============ 信用分 ============ */
const CREDIT_HISTORY = [
  {icon:'📦', title:'完成「帮带一杯珍珠奶茶」', time:'今天 09:20', delta:5, plus:true},
  {icon:'⚡', title:'接单响应快（< 5 分钟）', time:'昨天 18:02', delta:2, plus:true},
  {icon:'🤝', title:'获得雇主好评', time:'昨天 20:15', delta:3, plus:true},
  {icon:'🕐', title:'按时送达，无超时', time:'前天 12:40', delta:3, plus:true},
  {icon:'📦', title:'完成「代取快递」', time:'上周', delta:5, plus:true},
];
function creditLevel(s){ if(s>=90)return['极好','🏅']; if(s>=80)return['良好','👍']; if(s>=70)return['一般','⚠️']; return['待提升','🚧'] }

/* ============ 视图切换 ============ */
function go(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('.tabbar button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(name==='home') renderHome();
  if(name==='me'){ renderProfile(); renderMy(); }
  window.scrollTo({top:0});
}

/* ============ 首页渲染 ============ */
let curFilter = 'all';
function renderHome(){
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const all = [{k:'all',name:'全部',icon:'✨'}].concat(Object.keys(CATS).map(k=>({k,name:CATS[k].icon+' '+CATS[k].name,icon:''})));
  all.forEach(c=>{
    const b=document.createElement('div');
    b.className='chip'+(curFilter===c.k?' active':'');
    b.textContent=c.name;
    b.onclick=()=>{curFilter=c.k;renderHome()};
    chips.appendChild(b);
  });
  const list = tasks.filter(t=>curFilter==='all'||t.cat===curFilter);
  document.getElementById('taskCount').textContent = '共 '+list.length+' 单';
  document.getElementById('taskList').innerHTML = list.map(card).join('');
}

function card(t){
  const c=CATS[t.cat];
  const mine = t.pub===ME.name;
  const statusTxt = t.status==='open'?'可接单':(t.status==='accepted'?'已有人接单':'已完成');
  const statusCls = 'status-'+t.status;
  // 低信用提醒
  let warn='';
  if(t.pubCredit<80) warn='<span class="tag credit-low">⚠️ 信用较低</span>';
  else if(t.pubCredit<90) warn='<span class="tag credit-mid">新用户</span>';
  const badge = t.pubVerified?'<span class="verified">✔ 实名</span>':'<span class="verified" style="color:#98A2B3">未实名</span>';
  return `
  <div class="task-card" onclick="openSheet('${t.id}')">
    <div class="task-head">
      <div class="cat-ico" style="background:${c.color}">${c.icon}</div>
      <div class="task-meta">
        <div class="task-title">${t.title} ${warn}</div>
        <div class="task-sub">
          <span>📍 ${t.loc||'校园内'}</span><span>⏰ ${t.deadline}</span>
        </div>
      </div>
    </div>
    <div class="task-foot">
      <div class="publisher">
        <div class="avatar">${t.pub[0]}</div>
        <div>${t.pub} ${badge}<br><span style="font-size:11px">信用分 ${t.pubCredit}</span></div>
      </div>
      <div style="text-align:right">
        <div class="reward">¥${t.reward}<small> 跑腿费</small></div>
        <div style="margin-top:3px"><span class="status-pill ${statusCls}">${mine?'我发布的 · ':''}${statusTxt}</span></div>
      </div>
    </div>
  </div>`;
}

/* ============ 详情浮层 ============ */
function openSheet(id){
  const t=tasks.find(x=>x.id===id); if(!t)return;
  const c=CATS[t.cat]; const mine=t.pub===ME.name;
  let actions='';
  if(t.status==='open' && !mine){
    actions = `
      <div class="credit-note">🛡️ 接单需实名认证；雇主信用分 ${t.pubCredit}${t.pubCredit<80?'（偏低，请谨慎交易）':'（可信）'}，完成后平台结算并互评。</div>
      <button class="btn btn-primary btn-block" onclick="accept('${t.id}')">立即接单</button>`;
  }else if(t.status==='accepted' && t.acc===ME.name){
    actions = `<button class="btn btn-trust btn-block" onclick="finish('${t.id}')">确认完成，结算跑腿费</button>`;
  }else if(t.status==='done' && t.acc===ME.name){
    actions = `<div class="credit-note">✅ 已完成，已获 +${5} 信用分</div>`;
  }else if(mine && t.status==='accepted'){
    actions = `<div class="credit-note">🤝 ${t.acc} 已接单，请及时联系交付。</div>`;
  }else{
    actions = `<div class="credit-note">🔒 该任务已完成，查看历史记录。</div>`;
  }
  document.getElementById('sheet').innerHTML = `
    <div class="grabber"></div>
    <div class="cat-big"><div class="cat-ico" style="background:${c.color}">${c.icon}</div>
      <div><span class="status-pill ${'status-'+t.status}">${t.status==='open'?'可接单':(t.status==='accepted'?'进行中':'已完成')}</span>
      <div style="font-size:13px;color:var(--sub);margin-top:4px">${c.name} · ${t.id.toUpperCase()}</div></div>
    </div>
    <h3>${t.title}</h3>
    <div class="desc">${t.desc||'暂无更多描述'}</div>
    <div class="kv"><b>跑腿费</b><span class="v" style="color:var(--primary);font-weight:800;font-size:16px">¥${t.reward}</span></div>
    <div class="kv"><b>任务地点</b><span class="v">📍 ${t.loc||'校园内'}</span></div>
    <div class="kv"><b>截止时间</b><span class="v">⏰ ${t.deadline}</span></div>
    <div class="kv"><b>发布人</b><span class="v"><span class="avatar" style="width:22px;height:22px;font-size:11px">${t.pub[0]}</span> ${t.pub} ${t.pubVerified?'<span class="verified">✔实名</span>':'<span style="color:#98A2B3">未实名</span>'}</span></div>
    <div class="kv"><b>雇主信用分</b><span class="v" style="color:${t.pubCredit>=80?'var(--trust)':'var(--amber)'};font-weight:800">${t.pubCredit} 分</span></div>
    ${t.acc?`<div class="kv"><b>接单人</b><span class="v">${t.acc} · 信用分 ${t.accCredit}</span></div>`:''}
    <div class="actions">${actions}</div>`;
  document.getElementById('mask').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){
  document.getElementById('mask').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function accept(id){
  const t=tasks.find(x=>x.id===id); t.status='accepted'; t.acc=ME.name; t.accCredit=ME.credit;
  persist(); closeSheet(); renderHome();
  toast('接单成功！信用分 +2（按时完成后再 +3）');
}
function finish(id){
  const t=tasks.find(x=>x.id===id); t.status='done';
  persist(); closeSheet(); renderHome(); if(document.getElementById('view-me').classList.contains('active'))renderMy();
  toast('已完成，跑腿费已结算，信用分 +3 🎉');
}

/* ============ 发布 ============ */
let selCat='express';
function renderPublishCats(){
  const box=document.getElementById('publishCat');
  box.innerHTML='';
  Object.keys(CATS).forEach(k=>{
    const b=document.createElement('div');
    b.className='chip'+(selCat===k?' active':'');
    b.textContent=CATS[k].icon+' '+CATS[k].name;
    b.onclick=()=>{selCat=k;renderPublishCats()};
    box.appendChild(b);
  });
}
function publish(){
  const title=document.getElementById('pTitle').value.trim();
  const reward=parseInt(document.getElementById('pReward').value,10);
  if(!title){toast('请填写任务标题');return}
  if(!reward||reward<1){toast('请填写有效的跑腿费');return}
  tasks.unshift({
    id:'t'+Date.now(), cat:selCat, title,
    desc:document.getElementById('pDesc').value.trim()||'暂无更多描述',
    reward, loc:document.getElementById('pLoc').value.trim()||'校园内',
    deadline:document.getElementById('pDeadline').value.trim()||'尽快',
    status:'open', pub:ME.name, pubCredit:ME.credit, pubVerified:true,
  });
  persist();
  ['pTitle','pDesc','pReward','pLoc','pDeadline'].forEach(i=>document.getElementById(i).value='');
  toast('发布成功！跑腿费已托管 🔒');
  go('home');
}

/* ============ 我的 ============ */
function renderProfile(){
  document.getElementById('topCredit').textContent=ME.credit;
  document.getElementById('myScore').textContent=ME.credit;
  const c=2*Math.PI*36;
  document.getElementById('ringBar').style.strokeDasharray=c;
  document.getElementById('ringBar').style.strokeDashoffset=c*(1-ME.credit/100);
}
function switchMyTab(t){ myTab=t;
  document.querySelectorAll('.tab2 button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  renderMy();
}
function renderMy(){
  const el=document.getElementById('myList');
  if(myTab==='history'){
    el.innerHTML = CREDIT_HISTORY.map(h=>`
      <div class="history-item">
        <div class="h-ico" style="background:${h.plus?'var(--trust-soft)':'var(--red-soft)'}">${h.icon}</div>
        <div class="h-txt"><b>${h.title}</b><span>${h.time}</span></div>
        <div class="score-delta ${h.plus?'score-plus':'score-minus'}">${h.plus?'+':''}${h.delta}</div>
      </div>`).join('');
    return;
  }
  const list = myTab==='published' ? tasks.filter(t=>t.pub===ME.name) : tasks.filter(t=>t.acc===ME.name);
  if(!list.length){ el.innerHTML='<div class="empty"><div class="e">🍃</div>暂无记录，去大厅接一单吧</div>'; return; }
  el.innerHTML = list.map(t=>{
    const c=CATS[t.cat];
    const st = t.status==='open'?'待接单':(t.status==='accepted'?'进行中':'已完成');
    return `
    <div class="task-card" style="margin-bottom:10px" onclick="openSheet('${t.id}')">
      <div class="task-head">
        <div class="cat-ico" style="background:${c.color}">${c.icon}</div>
        <div class="task-meta">
          <div class="task-title">${t.title}</div>
          <div class="task-sub"><span>${c.name}</span><span>⏰ ${t.deadline}</span></div>
        </div>
        <div style="text-align:right"><div class="reward">¥${t.reward}</div><span class="status-pill ${'status-'+t.status}" style="display:inline-block;margin-top:4px">${st}</span></div>
      </div>
    </div>`;
  }).join('');
}

/* ============ toast ============ */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ 初始化 ============ */
renderPublishCats();
renderHome();
renderProfile();
</script>
</body>
</html>
